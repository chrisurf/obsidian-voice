name: Code Quality & Build Validation

# Runs only when a pull request into main is open (opened / updated / reopened),
# not on every branch push. Push a branch with no PR and nothing runs; open a
# PR and this re-runs on each new commit.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  code-quality-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Lint (Obsidian guidelines)
        run: npm run lint:check

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Build plugin
        run: npm run build

      - name: Verify plugin structure
        run: |
          if [ ! -f main.js ]; then
            echo "❌ main.js is missing"
            exit 1
          fi
          if [ ! -f manifest.json ]; then
            echo "❌ manifest.json is missing"
            exit 1
          fi
          if [ ! -f styles.css ]; then
            echo "❌ styles.css is missing"
            exit 1
          fi
          echo "✅ Plugin structure is valid"
