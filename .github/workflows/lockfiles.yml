name: Lockfile in sync

# npm is the single package manager for this project (declared via
# "packageManager" in package.json). package-lock.json is the one committed
# lockfile and the release builds from it with `npm ci`.
#
# This matters beyond convenience: npm and yarn hoist node_modules differently,
# and esbuild bakes the resulting module paths into main.js. Installing with a
# different manager therefore produces a byte-different bundle from the same
# source, which breaks reproducible-build verification of the released artifact.
#
# This guard fails the PR whenever package-lock.json has drifted from
# package.json, so a dependency change must always commit the updated lockfile.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feature/*"
      - "fix/*"
      - "chore/*"
      - "release/*"

jobs:
  npm-lockfile:
    name: package-lock.json (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # `npm ci` refuses to run if package-lock.json and package.json disagree,
      # so it doubles as the lockfile-sync check.
      - name: Verify package-lock.json is in sync
        run: |
          npm ci || {
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' and commit package-lock.json."
            exit 1
          }

      # A competing lockfile would resolve dependencies differently and make the
      # released main.js unreproducible. Both are gitignored; this catches one
      # that was force-added anyway.
      - name: Ensure no competing lockfile
        run: |
          for f in yarn.lock pnpm-lock.yaml; do
            if [ -f "$f" ]; then
              echo "::error::$f is committed. This project uses npm only — remove it and use package-lock.json."
              exit 1
            fi
          done
