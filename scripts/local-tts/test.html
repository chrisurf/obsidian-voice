<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Hörtest</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --card: #fff;
        --text: #1d1d1f;
        --muted: #6b6b70;
        --line: #e2e2e0;
        --accent: #7c5cf0;
        --ok: #1f8a4c;
        --bad: #c23a3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161618;
          --card: #222226;
          --text: #ececee;
          --muted: #9a9aa2;
          --line: #34343a;
          --accent: #9d84ff;
          --ok: #4cc27f;
          --bad: #ff7a7a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      label {
        color: var(--muted);
        font-size: 13px;
      }
      select,
      button,
      textarea {
        font: inherit;
        color: inherit;
      }
      select {
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
      }
      textarea {
        width: 100%;
        min-height: 260px;
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
        resize: vertical;
      }
      button {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 14px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      audio {
        width: 100%;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        color: var(--muted);
        max-height: 220px;
        overflow: auto;
        margin: 8px 0 0;
      }
      .status {
        color: var(--muted);
        font-size: 13px;
        min-height: 1.5em;
      }
      .progress {
        margin-top: 12px;
      }
      .progress[hidden] {
        display: none;
      }
      .progress-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .progress-time {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 10px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--accent);
        transition: width 0.4s ease;
      }
      .bar.indeterminate .bar-fill {
        width: 30%;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        margin-top: 8px;
      }
      td,
      th {
        border-bottom: 1px solid var(--line);
        padding: 4px 6px;
        text-align: left;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      ul {
        margin: 6px 0 0;
        padding-left: 18px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Voice Hörtest</h1>
      <p class="sub">
        Die Notiz läuft durch Voice' eigene Verarbeitung und wird von der
        lokalen Stimme gesprochen. <b>Vergleichen</b> erzeugt beide Fassungen:
        vorher (ohne Sprachprofil) und nachher (mit deutschem Profil).
      </p>

      <div class="card">
        <div class="row">
          <label for="sample">Beispiel</label>
          <select id="sample"></select>
          <label for="voice">Stimme</label>
          <select id="voice"></select>
        </div>
        <textarea id="markdown" spellcheck="false"></textarea>
        <div class="row" style="margin-top: 10px">
          <button class="primary" id="compare">Vergleichen</button>
          <button id="after">Nur nachher</button>
          <button id="before">Nur vorher</button>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-head">
            <span id="progress-label"></span>
            <span class="progress-time" id="progress-time"></span>
          </div>
          <div class="bar" id="bar">
            <div class="bar-fill" id="bar-fill"></div>
          </div>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="grid">
        <div class="card" id="card-before" hidden>
          <h2>Vorher <span class="sub">(ohne Profil)</span></h2>
          <audio id="audio-before" controls></audio>
          <div class="row" style="margin-top: 8px">
            <button data-measure="before">Messen</button>
          </div>
          <div id="report-before"></div>
          <pre id="text-before"></pre>
        </div>
        <div class="card" id="card-after" hidden>
          <h2>Nachher <span class="sub">(mit Sprachprofil)</span></h2>
          <audio id="audio-after" controls></audio>
          <div class="row" style="margin-top: 8px">
            <button data-measure="after">Messen</button>
          </div>
          <div id="report-after"></div>
          <pre id="text-after"></pre>
        </div>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const status = (text) => ($("status").textContent = text);
      const BOUNDARY = {
        heading: "Überschrift",
        paragraph: "Absatz",
        item: "Listenpunkt",
        ".": "Punkt",
        "?": "Fragezeichen",
        "!": "Ausrufezeichen",
        ":": "Doppelpunkt",
        ";": "Semikolon",
        "—": "Gedankenstrich",
        ",": "Komma",
        cell: "Tabellenzelle",
        abbr: "Abkürzung",
        none: "kein Satzzeichen",
      };
      // The last audio per side must be measured right after it was made: the
      // server measures its most recent recording.
      const lastSide = { side: null };

      async function json(url, body, signal) {
        const response = await fetch(
          url,
          body
            ? {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
                signal,
              }
            : undefined,
        );
        const data = await response.json();
        if (!response.ok)
          throw new Error(data.error?.message || response.status);
        return data;
      }

      // Characters per second the voice usually manages, until a real rate is known.
      const DEFAULT_RATE = 25;
      const fmt = (seconds) => `${Math.max(0, Math.round(seconds))} s`;

      function showProgress(label, fraction, timeText) {
        $("progress").hidden = false;
        $("progress-label").textContent = label;
        $("progress-time").textContent = timeText || "";
        $("bar").classList.toggle("indeterminate", fraction === null);
        if (fraction !== null) {
          $("bar-fill").style.width = `${Math.round(fraction * 100)}%`;
        }
      }

      /** Poll the server's progress while the voice speaks; returns a stop function. */
      function trackSpeech(label) {
        let stopped = false;
        const tick = async () => {
          if (stopped) return;
          try {
            const p = await json("/progress");
            if (p.active && p.total > 0) {
              const rate = p.done > 0 ? p.done / p.elapsed : DEFAULT_RATE;
              // Between segments, advance by the rate so the bar keeps moving.
              const estimate = Math.min(
                p.total * 0.97,
                Math.max(p.done, p.elapsed * rate),
              );
              showProgress(
                `${label}: Stimme spricht … ${Math.round((estimate / p.total) * 100)} %`,
                estimate / p.total,
                `${fmt(p.elapsed)} · noch ca. ${fmt((p.total - estimate) / rate)}`,
              );
            }
          } catch {
            // A missed poll is fine; the next one catches up.
          }
          if (!stopped) setTimeout(tick, 500);
        };
        tick();
        return () => (stopped = true);
      }

      async function speak(side, step) {
        const legacy = side === "before";
        const label = `${legacy ? "Vorher" : "Nachher"}${step}`;
        status("");
        showProgress(`${label}: Text wird aufbereitet …`, null);
        const { text } = await json(
          "/render",
          { markdown: $("markdown").value, legacy },
          current.controller.signal,
        );
        showProgress(`${label}: Stimme startet …`, 0, `${text.length} Zeichen`);
        const started = performance.now();
        const stop = trackSpeech(label);
        let response;
        try {
          response = await fetch("/v1/audio/speech", {
            signal: current.controller.signal,
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              input: text,
              voice: $("voice").value,
              response_format: "mp3",
            }),
          });
        } finally {
          stop();
        }
        if (!response.ok)
          throw new Error(`Sprachausgabe fehlgeschlagen (${response.status})`);
        const seconds = (performance.now() - started) / 1000;
        showProgress(`${label}: fertig`, 1, fmt(seconds));
        const blob = await response.blob();
        $(`card-${side}`).hidden = false;
        $(`audio-${side}`).src = URL.createObjectURL(blob);
        $(`text-${side}`).textContent = text;
        $(`report-${side}`).innerHTML = "";
        lastSide.side = side;
        status(`${label} fertig in ${seconds.toFixed(1)} s – Player unten.`);
      }

      // The reading in progress, if any: while it runs, "Vergleichen" becomes
      // "Abbrechen" so the page is never stuck waiting.
      const current = { controller: null };
      const generateButtons = ["compare", "after", "before"].map($);

      async function run(sides) {
        if (current.controller) {
          current.controller.abort();
          return;
        }
        current.controller = new AbortController();
        generateButtons.forEach((b) => (b.disabled = b.id !== "compare"));
        $("compare").textContent = "Abbrechen";
        try {
          for (const [i, side] of sides.entries()) {
            await speak(
              side,
              sides.length > 1 ? ` (${i + 1}/${sides.length})` : "",
            );
          }
        } catch (error) {
          $("progress").hidden = true;
          status(
            error.name === "AbortError"
              ? "Abgebrochen. Die Stimme rechnet den laufenden Abschnitt noch zu Ende; ein neuer Start wartet kurz darauf."
              : `Fehler: ${error.message}`,
          );
        } finally {
          current.controller = null;
          generateButtons.forEach((b) => (b.disabled = false));
          $("compare").textContent = "Vergleichen";
        }
      }

      async function measure(side) {
        if (lastSide.side !== side) {
          status(
            "Gemessen wird immer die zuletzt erzeugte Fassung – bitte diese Seite zuletzt erzeugen.",
          );
          return;
        }
        status("");
        showProgress("Messe mit Whisper …", null);
        try {
          const r = await json("/measure", { markdown: $("markdown").value });
          const rows = Object.entries(r.pauses_by_boundary)
            .map(
              ([b, v]) =>
                `<tr><td>${BOUNDARY[b] || b}</td><td>${v.count}</td><td>${v.mean.toFixed(2)} s</td></tr>`,
            )
            .join("");
          const list = (items, f) =>
            items.length ? `<ul>${items.map(f).join("")}</ul>` : "";
          $(`report-${side}`).innerHTML = `
            <table><tr><th>Pause nach</th><th>Anzahl</th><th>Ø Länge</th></tr>${rows}</table>
            <p class="${r.stray_pauses.length ? "bad" : "ok"}">Pausen mitten im Satz: ${r.stray_pauses.length}</p>
            ${list(r.stray_pauses, (p) => `<li>${p.seconds.toFixed(2)} s zwischen „${p.after}“ und „${p.next}“</li>`)}
            <p class="${r.missing_sentence_pauses.length ? "bad" : "ok"}">Fehlende Pausen an Satzenden: ${r.missing_sentence_pauses.length}</p>
            <p>Wort-Treffer: ${(r.word_accuracy * 100).toFixed(0)} %</p>
            ${list(r.misread, (m) => `<li>erwartet „${m.expected}“, gehört „${m.heard}“</li>`)}`;
          showProgress("Messung fertig", 1);
        } catch (error) {
          $("progress").hidden = true;
          status(`Fehler beim Messen: ${error.message}`);
        }
      }

      $("compare").onclick = () => run(["before", "after"]);
      $("after").onclick = () => run(["after"]);
      $("before").onclick = () => run(["before"]);
      document
        .querySelectorAll("[data-measure]")
        .forEach((b) => (b.onclick = () => measure(b.dataset.measure)));

      (async () => {
        const [corpus, voices] = await Promise.all([
          json("/corpus"),
          json("/v1/audio/voices"),
        ]);
        for (const name of Object.keys(corpus))
          $("sample").add(new Option(name, name));
        for (const v of voices.voices) $("voice").add(new Option(v.name, v.id));
        $("sample").value = corpus.testnotiz
          ? "testnotiz"
          : Object.keys(corpus)[0];
        $("markdown").value = corpus[$("sample").value];
        $("sample").onchange = () =>
          ($("markdown").value = corpus[$("sample").value]);
      })();
    </script>
  </body>
</html>
